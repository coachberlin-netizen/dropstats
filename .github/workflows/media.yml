# Captura recursos para el vídeo promocional (capturas reales de dropstats.vercel.app y modelos de voz Piper).
# Se ejecuta al subir a la rama media-job y publica el resultado en la rama media-out.
name: media
on:
  push:
    branches: [media-job]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Esperar a que Vercel publique la última versión
        run: |
          for i in $(seq 1 40); do curl -s https://dropstats.vercel.app/ | grep -q "padding-top:100%}" && echo listo && break; sleep 15; done
      - name: Capturas
        run: python tools/capture.py
      - name: Publicar en media-out
        run: |
          git config user.name "dropstats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv out /tmp/out
          git checkout --orphan media-out
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mv /tmp/out out
          git add out
          git commit -qm "Recursos del vídeo"
          git push -f origin media-out
