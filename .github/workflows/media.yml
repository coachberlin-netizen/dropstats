# Captura recursos para el vídeo promocional (capturas reales de dropstats.vercel.app y modelos de voz Piper).
# Se ejecuta al subir a la rama media-job y publica el resultado en la rama media-out.
name: media
on:
  push:
    branches: [media-job]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voz (Kokoro)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          pip install -q "kokoro>=0.9.4" soundfile
          python tools/tts.py
      - name: Publicar en media-out
        run: |
          git config user.name "dropstats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv out /tmp/out
          git checkout --orphan media-out
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mv /tmp/out out
          git add out
          git commit -qm "Recursos del vídeo"
          git push -f origin media-out
